<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Renderer</title>

  <!-- Mapbox GL JS v3 -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

  <!-- Effects library -->
  <link rel="stylesheet" href="effects.css">
  <script src="effects.js"></script>

  <style>
    /* ── Reset: full 1920×1080 frame, no scrollbars ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width:  1920px;
      height: 1080px;
      overflow: hidden;
      background: #0d1117;
    }

    /* ── Map fills the entire frame ── */
    #map {
      position: absolute;
      inset: 0;
      width:  1920px;
      height: 1080px;
    }

    /* ── Overlay sits above the WebGL canvas, pointer events disabled ── */
    #overlay {
      position: absolute;
      inset: 0;
      width:  1920px;
      height: 1080px;
      pointer-events: none;
      z-index: 10;
      overflow: visible;
    }

    /* ── Single SVG layer for all arrows/paths ── */
    #arrows-layer {
      position: absolute;
      inset: 0;
      width:  100%;
      height: 100%;
      overflow: visible;
    }

    /* ── Div layer for all HTML labels ── */
    #labels-layer {
      position: absolute;
      inset: 0;
      width:  100%;
      height: 100%;
    }

    /* ── Loading screen shown until tiles are ready ── */
    #loading-screen {
      position: absolute;
      inset: 0;
      background: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.6s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Hide default Mapbox UI chrome ── */
    .mapboxgl-ctrl-logo,
    .mapboxgl-ctrl-attrib,
    .mapboxgl-ctrl-group { display: none !important; }
  </style>
</head>
<body>

  <!-- Map canvas -->
  <div id="map"></div>

  <!-- Overlay: arrows + labels float above map -->
  <div id="overlay">
    <svg  id="arrows-layer" xmlns="http://www.w3.org/2000/svg"></svg>
    <div  id="labels-layer"></div>
  </div>

  <!-- Loading screen — hidden once tiles load -->
  <div id="loading-screen">
    <div class="loading-spinner"></div>
  </div>

<script>
(function () {
  'use strict';

  /* ============================================================
     CONFIG
     Replace TOKEN with your Mapbox public token.
     Get one free at https://account.mapbox.com/
     ============================================================ */
  var MAPBOX_TOKEN = window.MAPBOX_TOKEN || '';

  /* ── Built-in style aliases ─────────────────────────────── */
  var STYLES = {
    dark:      'mapbox://styles/mapbox/dark-v11',
    satellite: 'mapbox://styles/mapbox/satellite-v9',
    terrain:   'mapbox://styles/mapbox/outdoors-v12',
    light:     'mapbox://styles/mapbox/light-v11',
    streets:   'mapbox://styles/mapbox/streets-v12',
  };

  /* ── State ───────────────────────────────────────────────── */
  var map          = null;
  var overlayEl    = document.getElementById('overlay');
  var loadingEl    = document.getElementById('loading-screen');
  var unbindReproject = null;
  var sceneRunning = false;
  var activeStyleKey = 'dark';
  var renderMode = false;
  var deterministicRuntime = null;
  var deterministicScene = null;
  var deterministicCameraPlan = null;
  var deterministicSeed = 1;

  /* window.sceneReady — Playwright polls this before calling playScene() */
  window.sceneReady = false;

  function normalizeStyleKey(styleKeyOrUrl) {
    if (typeof styleKeyOrUrl !== 'string' || styleKeyOrUrl.length === 0) {
      return 'dark';
    }
    if (Object.prototype.hasOwnProperty.call(STYLES, styleKeyOrUrl)) {
      return styleKeyOrUrl;
    }
    return styleKeyOrUrl;
  }

  /* ============================================================
     MAP INIT
     Called once on page load with a default style.
     playScene() can change the style before running a scene.
     ============================================================ */
  function initMap(styleKey) {
    styleKey = styleKey || 'dark';
    var styleUrl = STYLES[styleKey] || styleKey; // accept raw URL too
    activeStyleKey = normalizeStyleKey(styleKey);

    mapboxgl.accessToken = MAPBOX_TOKEN;

    map = new mapboxgl.Map({
      container:   'map',
      style:        styleUrl,
      center:       [20, 30],   // default: Europe/Africa view
      zoom:         2,
      pitch:        0,
      bearing:      0,
      interactive:  false,      // CRITICAL — no mouse/touch input
      attributionControl: false,
      logoPosition: 'bottom-left',
      antialias:    true,       // smoother edges for fills/borders
      preserveDrawingBuffer: true, // required for canvas screenshot if needed
      fadeDuration: 0,          // avoid tile fade shimmer during motion capture
      prefetchZoomDelta: 0,     // reduce aggressive background tile prefetch
      renderWorldCopies: false,
    });

    /* Hide Mapbox UI controls */
    map.dragPan.disable();
    map.scrollZoom.disable();
    map.boxZoom.disable();
    map.dragRotate.disable();
    map.keyboard.disable();
    map.doubleClickZoom.disable();
    map.touchZoomRotate.disable();

    /* Bind reproject so overlays stay pinned during camera moves */
    unbindReproject = window.MapEffects.bindReproject(map, overlayEl);

    /* Signal ready when style + tiles have loaded */
    map.once('idle', function () {
      window.sceneReady = true;
      if (loadingEl) loadingEl.classList.add('hidden');
      console.log('[map.html] Map ready. window.sceneReady = true');
    });

    return map;
  }

  /* ============================================================
     CHANGE STYLE
     Swaps the Mapbox base style mid-session.
     Returns a Promise that resolves when new style is loaded.
     ============================================================ */
  function changeStyle(styleKeyOrUrl) {
    return new Promise(function (resolve) {
      var url = STYLES[styleKeyOrUrl] || styleKeyOrUrl;
      var nextStyleKey = normalizeStyleKey(styleKeyOrUrl);
      window.sceneReady = false;
      var done = false;

      function finish() {
        if (done) return;
        done = true;
        window.sceneReady = true;
        resolve();
      }

      var timeoutMs = 12000;
      var timeoutId = setTimeout(function () {
        console.warn('[map.html] changeStyle timeout after ' + timeoutMs + 'ms; continuing.');
        finish();
      }, timeoutMs);

      map.setStyle(url);
      map.once('style.load', function () {
        clearTimeout(timeoutId);
        activeStyleKey = nextStyleKey;
        finish();
      });
    });
  }

  /* ============================================================
     INITIAL CAMERA
     Applies the scene's opening camera position before the
     timeline starts. Uses flyTo if duration > 0, jumpTo otherwise.
     Returns a Promise resolving when camera arrives.
     ============================================================ */
  function applyInitialCamera(cameraSpec) {
    return new Promise(function (resolve) {
      if (!cameraSpec) { resolve(); return; }
      var done = false;

      function finish() {
        if (done) return;
        done = true;
        resolve();
      }

      var opts = {
        center:  cameraSpec.center  || [20, 30],
        zoom:    cameraSpec.zoom    || 3,
        pitch:   cameraSpec.pitch   || 0,
        bearing: cameraSpec.bearing || 0,
      };

      var duration = typeof cameraSpec.duration === 'number'
        ? cameraSpec.duration * 1000
        : 2000;

      if (duration === 0) {
        map.jumpTo(opts);
        finish();
      } else {
        var timeoutMs = duration + 3000;
        var timeoutId = setTimeout(function () {
          console.warn('[map.html] applyInitialCamera timeout after ' + timeoutMs + 'ms; continuing.');
          finish();
        }, timeoutMs);

        map.flyTo(Object.assign({}, opts, {
          duration:  duration,
          essential: true,
          easing:    easeInOutCubic,
        }));
        map.once('moveend', function () {
          clearTimeout(timeoutId);
          finish();
        });
      }
    });
  }

  /* ── Easing function for camera moves ── */
  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function cameraFromSpec(spec) {
    return {
      center: spec.center || [20, 30],
      zoom: spec.zoom ?? 2,
      pitch: spec.pitch ?? 0,
      bearing: spec.bearing ?? 0,
    };
  }

  function interpolateCamera(from, to, p) {
    return {
      center: [
        from.center[0] + (to.center[0] - from.center[0]) * p,
        from.center[1] + (to.center[1] - from.center[1]) * p,
      ],
      zoom: from.zoom + (to.zoom - from.zoom) * p,
      pitch: from.pitch + (to.pitch - from.pitch) * p,
      bearing: from.bearing + (to.bearing - from.bearing) * p,
    };
  }

  function evaluateCameraPlan(segments, tSec, baseCamera) {
    var state = Object.assign({}, baseCamera, { center: [...baseCamera.center] });
    for (var i = 0; i < segments.length; i += 1) {
      var seg = segments[i];
      if (tSec < seg.start) break;
      if (seg.duration <= 0 || tSec >= seg.start + seg.duration) {
        state = Object.assign({}, seg.to, { center: [...seg.to.center] });
        continue;
      }
      var p = (tSec - seg.start) / seg.duration;
      var eased = easeInOutCubic(Math.max(0, Math.min(1, p)));
      state = interpolateCamera(seg.from, seg.to, eased);
      return state;
    }
    return state;
  }

  function buildDeterministicCameraPlan(scene) {
    var baseCamera = { center: [20, 30], zoom: 2, pitch: 0, bearing: 0 };
    var segments = [];
    var initial = scene.camera ? cameraFromSpec(scene.camera) : null;
    var initialDuration = scene.camera && typeof scene.camera.duration === 'number'
      ? scene.camera.duration
      : 2.0;

    if (initial) {
      segments.push({
        start: 0,
        duration: Math.max(0, initialDuration),
        from: baseCamera,
        to: initial,
      });
    }

    var timeline = Array.isArray(scene.timeline) ? [...scene.timeline] : [];
    timeline
      .filter(function (e) { return e.action === 'flyTo'; })
      .sort(function (a, b) { return (a.at ?? 0) - (b.at ?? 0); })
      .forEach(function (entry) {
        var start = Number(entry.at ?? 0);
        var duration = Number(entry.params?.duration ?? 2);
        var from = evaluateCameraPlan(segments, start, baseCamera);
        var to = cameraFromSpec(entry.params ?? {});
        segments.push({
          start: start,
          duration: Math.max(0, duration),
          from: from,
          to: to,
        });
      });

    return { baseCamera: baseCamera, segments: segments };
  }

  /* ============================================================
     CLEAR SCENE STATE
     Removes all overlay elements and Mapbox layers from a
     previous scene before running the next one.
     ============================================================ */
  function clearSceneState() {
    window.MapEffects.clearOverlay(overlayEl);

    /* Remove any dynamically-added Mapbox layers/sources */
    var style = map.getStyle();
    if (!style) return;

    (style.layers || []).forEach(function (layer) {
      if (layer.id && layer.id.endsWith('-layer')) {
        try { map.removeLayer(layer.id); } catch(e) {}
      }
    });
    Object.keys(style.sources || {}).forEach(function (id) {
      if (id.endsWith('-source')) {
        try { map.removeSource(id); } catch(e) {}
      }
    });
  }

  /* ============================================================
     window.playScene(scene)
     ─────────────────────────────────────────────────────────────
     Main entry point. Called by Playwright after polling
     window.sceneReady === true.

     scene shape (matches your JSON schema):
     {
       duration:   number,         // total seconds
       map_style:  string,         // 'dark' | 'satellite' | raw URL
       camera: {
         center:   [lng, lat],
         zoom:     number,
         pitch:    number,         // 0–60
         bearing:  number,         // 0–360
         duration: number,         // seconds for opening flyTo (0 = instant)
       },
       timeline: [
         { at: number, action: string, params: object }
       ]
     }

     Returns: Promise resolving when scene.duration elapses.
     ============================================================ */
  window.playScene = async function (scene) {
    if (sceneRunning) {
      console.warn('[map.html] playScene called while scene is running. Clearing.');
      clearSceneState();
    }
    sceneRunning = true;

    var style = scene.map_style || 'dark';
    var requestedStyleKey = normalizeStyleKey(style);

    /* 1. Change style if needed */
    if (requestedStyleKey !== activeStyleKey) {
      await changeStyle(style);
    }

    /* 2. Clear previous scene leftovers */
    clearSceneState();

    /* 3. Apply opening camera (concurrently with timeline) */
    var cameraPromise = Promise.resolve();
    if (scene.camera) {
      cameraPromise = applyInitialCamera(scene.camera);
    }

    /* 4. Run the timeline (scene.duration is total runtime budget) */
    await window.MapEffects.runTimeline(map, overlayEl, scene);
    await cameraPromise;

    sceneRunning = false;
    console.log('[map.html] Scene complete:', scene.duration + 's');
  };

  window.loadScene = async function (scene) {
    deterministicScene = scene;
    deterministicSeed = Number(scene._seed ?? 1);
    var style = scene.map_style || 'dark';
    var requestedStyleKey = normalizeStyleKey(style);
    if (requestedStyleKey !== activeStyleKey) {
      await changeStyle(style);
    }
    clearSceneState();
    deterministicCameraPlan = buildDeterministicCameraPlan(scene);
    deterministicRuntime = window.MapEffects.createDeterministicRuntime(
      map,
      overlayEl,
      scene,
      { seed: deterministicSeed }
    );
    map.jumpTo(deterministicCameraPlan.baseCamera);
    window.MapEffects.reproject(map, overlayEl);
    return { ok: true, duration: Number(scene.duration ?? 10) };
  };

  window.stepTo = async function (tSec) {
    if (!deterministicScene || !deterministicRuntime || !deterministicCameraPlan) {
      throw new Error('Deterministic scene not loaded. Call window.loadScene(scene) first.');
    }
    var t = Math.max(0, Number(tSec ?? 0));
    var camera = evaluateCameraPlan(
      deterministicCameraPlan.segments,
      t,
      deterministicCameraPlan.baseCamera
    );
    map.jumpTo(camera);
    deterministicRuntime.stepTo(t);
    await new Promise(function (resolve) { requestAnimationFrame(function () { resolve(); }); });
    return deterministicRuntime.getState();
  };

  window.getDeterministicState = function () {
    return {
      loaded: Boolean(deterministicRuntime),
      seed: deterministicSeed,
      cameraSegments: deterministicCameraPlan ? deterministicCameraPlan.segments.length : 0,
      effectState: deterministicRuntime ? deterministicRuntime.getState() : null,
    };
  };

  window.resetDeterministic = function () {
    if (deterministicRuntime) deterministicRuntime.reset();
    deterministicRuntime = null;
    deterministicScene = null;
    deterministicCameraPlan = null;
  };

  window.initDeterministic = function(token, options) {
    window.init(token, options || {});
    return true;
  };

  /* ============================================================
     window.jumpTo(cameraSpec)
     Quick camera reposition without a scene — useful for
     Playwright to verify a location before recording.
     ============================================================ */
  window.jumpTo = function (cameraSpec) {
    map.jumpTo({
      center:  cameraSpec.center  || [20, 30],
      zoom:    cameraSpec.zoom    || 3,
      pitch:   cameraSpec.pitch   || 0,
      bearing: cameraSpec.bearing || 0,
    });
  };

  /* ============================================================
     window.getSceneState()
     Debug helper — Playwright can call this to inspect state.
     ============================================================ */
  window.getSceneState = function () {
    return {
      sceneReady:  window.sceneReady,
      sceneRunning: sceneRunning,
      zoom:    map ? map.getZoom()    : null,
      center:  map ? map.getCenter()  : null,
      pitch:   map ? map.getPitch()   : null,
      bearing: map ? map.getBearing() : null,
    };
  };

  /* ============================================================
     BOOT
     Initialize map on page load with default dark style.
     Playwright waits for window.sceneReady before calling playScene().
     ============================================================ */
     window.init = function(token, options) {
       MAPBOX_TOKEN = token;
       renderMode = Boolean(options && options.renderMode);
       if (renderMode && loadingEl) {
         loadingEl.style.display = 'none';
       } else if (loadingEl) {
         loadingEl.style.display = 'flex';
       }
       initMap('dark');
     };

})();
</script>
</body>
</html>
