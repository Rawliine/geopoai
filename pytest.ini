[pytest]
# Markers — keep the fast logic suite usable as an acceptance gate.
#   pytest -m "not render and not network"   → fast: pure-logic/schema/contract
#   pytest -m render                          → slow real renders
#   pytest -m network                         → tests hitting live external APIs
# Any test that drives a real render (mp4/png, Playwright, full Manim scene)
# MUST carry @pytest.mark.render; any test hitting a live external API MUST
# carry @pytest.mark.network — so lanes can gate on the fast subset.
markers =
    render: drives a real Mapbox/Playwright or Manim render (slow; needs tokens/GPU)
    network: hits a live external API (flaky; opt-in only)
