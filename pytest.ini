[pytest]
# Markers — keep the fast logic suite usable as an acceptance gate.
#   pytest -m "not render"   → fast: pure-logic + schema + contract tests
#   pytest -m render         → slow: real Mapbox/Playwright or Manim renders
# Any test that drives a real render (mp4/png output, Playwright, full Manim
# scene) MUST carry @pytest.mark.render so lanes can gate on the fast subset.
markers =
    render: drives a real Mapbox/Playwright or Manim render (slow; needs tokens/GPU)
